name: "NPU-Sim-32x32"

systolic:
  rows: 32
  cols: 32
  clock_freq_mhz: 1000
  dataflow: "OS"

dtype:
  compute_dtype: "FP16"
  accumulator_dtype: "FP32"

sram:
  total_size_kb: 512
  num_banks: 32
  bank_width_bytes: 64
  port_type: "dual"
  read_latency_cycles: 1
  write_latency_cycles: 1
  weight_buffer_fraction: 0.4
  activation_buffer_fraction: 0.3
  output_buffer_fraction: 0.3

dram:
  use_dramsim3: true  # set true to use DRAMSim3 (requires build via scripts/setup_dramsim3.sh)
  config_file: "ext/DRAMsim3/configs/DDR4_8Gb_x16_2400.ini"
  output_dir: "dramsim3_output"
  # Simple DRAM fallback params (when use_dramsim3 is false or DRAMSim3 unavailable)
  bandwidth_gbps: 25.6
  latency_ns: 50.0

double_buffer:
  enabled: true
