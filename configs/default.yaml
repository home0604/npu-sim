name: "NPU-Sim-32x32"

systolic:
  rows: 32
  cols: 32
  clock_freq_mhz: 1000

dtype:
  compute_dtype: "INT8"
  accumulator_dtype: "INT32"

sram:
  total_size_kb: 512
  num_banks: 32
  bank_width_bytes: 64
  port_type: "dual"
  read_latency_cycles: 1
  write_latency_cycles: 1
  weight_buffer_fraction: 0.4
  activation_buffer_fraction: 0.3
  output_buffer_fraction: 0.3

dram:
  config_file: "configs/dramsim3/DDR4_8Gb_x16_2400.ini"
  output_dir: "/tmp/dramsim3_output"
  # Simple DRAM fallback params (when DRAMSim3 not available)
  bandwidth_gbps: 25.6
  latency_ns: 50

double_buffer:
  enabled: true
