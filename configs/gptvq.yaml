# gptvq.yaml - GPTVQ 실험용 config
# default.yaml을 상속하고 GPTVQ 관련 설정만 override

extends: default.yaml

name: NPU-Sim-32x32-GPTVQ

sram:
  # GPTVQ buffer fractions (standard fractions override)
  codebook_buffer_fraction: 0.10      # codebook: small but generous for large d
  index_buffer_fraction: 0.1         # compressed indices: tiny (tile_m × tile_k/d × 1B)
  scale_buffer_fraction: 0.05         # per-group scale/zero-point (optional)
  dequant_weight_buffer_fraction: 0.25  # dequantized weight tile (tile_m × tile_k × 2B)
  activation_buffer_fraction: 0.30    # activation tile (tile_k × tile_n × 2B)
  output_buffer_fraction: 0.20        # output tile (tile_m × tile_n × 4B)

gptvq:
  enabled: true
  codebook_size: 16           # R: centroid 수 (index_bits=4 → 2^4=16)
  vector_dim: 2               # d: codebook vector 차원
  index_bits: 4               # bits per index = log2(codebook_size)
  num_stages: 1               # S: RVQ/AQ stage 수 (standard VQ = 1)
  use_scaling: false          # per-group scaling: s * codebook[idx] + z
  scale_dtype: FP16
  zero_point_dtype: FP16
  codebook_dtype: FP16
  dequant_pipeline_stages: 3  # pipeline fill latency
  # dequant_throughput 제거 — SRAM bank 구조에서 자동 계산
  # read_latency = ceil(E * S / (N_bank * w_b))
