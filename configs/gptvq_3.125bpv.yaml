# gptvq_3.125bpv.yaml - GPTVQ 논문 Sweet Spot (3.125 bits per value)
#
# 논문 Table 7: 3.125bpv, 2D VQ
#   BPV = log2(k)/d + (k × d × b_c) / l
#       = log2(64)/2 + (64 × 2 × 8) / 8192
#       = 3 + 0.125 = 3.125
#
# 논문 기본: codebook INT8 (Section 5.3, Appendix G)
extends: default.yaml

name: GPTVQ-3.125bpv

sram:
  codebook_buffer_fraction: 0.10
  index_buffer_fraction: 0.10
  scale_buffer_fraction: 0.05
  dequant_weight_buffer_fraction: 0.25
  activation_buffer_fraction: 0.30
  output_buffer_fraction: 0.20
  codebook_sram:
    num_banks: 16
    port_type: single

vq:
  enabled: true
  codebook_size: 64            # k=64 centroids
  vector_dim: 2                # d=2 (2D VQ)
  index_bits: 6                # log2(64) = 6
  num_stages: 1                # standard VQ (no RVQ)
  use_scaling: true            # 논문 Table 16: per-group scaling 사용
  scale_dtype: FP16
  zero_point_dtype: FP16
  codebook_dtype: INT8         # 논문 기본: 8-bit codebook quantization
  dequant_pipeline_stages: 3
