[project]
name = "npu-sim"
version = "0.1.0"
description = "Systolic array NPU architectural simulator"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pybind11>=2.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src", "src.core", "src.compute", "src.memory", "src.dataflow", "src.sim", "src.workloads", "src.configs"]